<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">商品圖片製作：五個步驟</title><desc id="desc">安裝技能，提供資料夾，回答問題，選封面，查看成果及報告。</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;fill:#22362e}.small{font-size:19px;fill:#52665c}.heading{font-size:29px;font-weight:700}.label{font-size:24px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:21px}</style>
<rect width="1000" height="600" rx="24" fill="#f3f3e9"/>
<text x="40" y="56" class="heading">商品圖片製作：五個步驟</text>
<text x="40" y="91" class="small">流程示意圖 · 不含實際商品或 Codex 介面截圖</text>
<rect x="40" y="125" width="280" height="180" rx="16" fill="white" stroke="#d4ddd1"/><circle cx="78" cy="162" r="21" fill="#2e604b"/><text x="78" y="169" text-anchor="middle" style="fill:white;font-size:18px;font-weight:bold">01</text><text x="64" y="214" class="label">安裝一次</text><text x="64" y="251" class="small">貼上安裝文字</text><text x="64" y="280" class="small">完成後開新對話</text><rect x="360" y="125" width="280" height="180" rx="16" fill="white" stroke="#d4ddd1"/><circle cx="398" cy="162" r="21" fill="#2e604b"/><text x="398" y="169" text-anchor="middle" style="fill:white;font-size:18px;font-weight:bold">02</text><text x="384" y="214" class="label">提供資料夾</text><text x="384" y="251" class="small">貼上素材資料夾位置</text><text x="384" y="280" class="small">原圖保留不覆寫</text><rect x="680" y="125" width="280" height="180" rx="16" fill="white" stroke="#d4ddd1"/><circle cx="718" cy="162" r="21" fill="#2e604b"/><text x="718" y="169" text-anchor="middle" style="fill:white;font-size:18px;font-weight:bold">03</text><text x="704" y="214" class="label">回答問題</text><text x="704" y="251" class="small">確認商品與賣點</text><text x="704" y="280" class="small">缺少資訊先釐清</text><rect x="40" y="340" width="280" height="180" rx="16" fill="white" stroke="#d4ddd1"/><circle cx="78" cy="377" r="21" fill="#2e604b"/><text x="78" y="384" text-anchor="middle" style="fill:white;font-size:18px;font-weight:bold">04</text><text x="64" y="429" class="label">選擇封面</text><text x="64" y="466" class="small">A 高資訊量</text><text x="64" y="495" class="small">B 簡潔聚焦</text><rect x="360" y="340" width="280" height="180" rx="16" fill="white" stroke="#d4ddd1"/><circle cx="398" cy="377" r="21" fill="#2e604b"/><text x="398" y="384" text-anchor="middle" style="fill:white;font-size:18px;font-weight:bold">05</text><text x="384" y="429" class="label">查看成果</text><text x="384" y="466" class="small">1000 × 1000 JPG</text><text x="384" y="495" class="small">打開處理報告</text><text x="704" y="392" class="label">你只需要</text><text x="704" y="432" class="small">給素材、回答、選稿。</text><text x="704" y="466" class="small">不需要自己寫程式。</text><text x="40" y="570" class="small">遇到待確認事項，先看報告原因，再決定是否使用。</text></svg>